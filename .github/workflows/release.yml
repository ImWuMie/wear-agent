name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK packages
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -name sdkmanager -type f | head -1)"
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-36.1" "build-tools;36.0.0" "build-tools;36.1.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Resolve version
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          NAME="${TAG#v}"
          if [[ "$NAME" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            CODE=$((10#${BASH_REMATCH[1]} * 10000 + 10#${BASH_REMATCH[2]} * 100 + 10#${BASH_REMATCH[3]}))
          else
            echo "::error::Tag '$TAG' is not vMAJOR.MINOR.PATCH"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not set; refusing to publish a debug-signed APK"
            exit 1
          fi
          mkdir -p keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > keystore/wearagent.jks

      - name: Build release APK
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          SIGNING_STORE_FILE: keystore/wearagent.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-configuration-cache

      - name: Verify signature
        run: |
          APKSIGNER="$(find "$ANDROID_HOME" -name apksigner -type f | head -1)"
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk
          if "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | grep -qi "CN=Android Debug"; then
            echo "::error::APK is debug-signed"
            exit 1
          fi

      - name: Collect APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/wearagent-${{ steps.version.outputs.name }}.apk"
          ls -lh dist

      - name: Compose release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          APK="$(pwd)/app/build/outputs/apk/release/app-release.apk"
          apksigner() {
            local bin
            bin="$(find "$ANDROID_HOME" -name 'apksigner*' -type f 2>/dev/null | head -1)"
            "$bin" "$@"
          }
          PREV="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          {
            echo "## WearAgent ${{ steps.version.outputs.name }}"
            echo

            # Author-written summary: the annotated tag body, if any. Read it from the API
            # because actions/checkout rewrites refs/tags/<tag> to a lightweight tag at the
            # commit, which makes `git tag --format` fall back to the commit message.
            TAG_OBJ="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --jq .object.sha 2>/dev/null || true)"
            NOTES=""
            if [ -n "$TAG_OBJ" ]; then
              NOTES="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${TAG_OBJ}" --jq .message 2>/dev/null \
                | tail -n +3 | sed -e 's/[[:space:]]*$//' | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}')"
            fi
            if [ -n "$NOTES" ]; then echo "$NOTES"; echo; fi

            if [ -n "$PREV" ]; then
              echo "### Changes since $PREV"
              RANGE="$PREV..$TAG"
            else
              echo "### Commits"
              RANGE="$TAG"
            fi
            echo
            GROUPED="$(git log --no-merges --pretty=format:'%s|%h' "$RANGE" | awk -F'|' '
              {
                line = "- " $1 " (" $2 ")"
                if ($1 ~ /^feat/) feats = feats line "\n"
                else if ($1 ~ /^fix/) fixes = fixes line "\n"
                else other = other line "\n"
              }
              END {
                if (feats != "") printf "#### Features\n\n%s\n", feats
                if (fixes != "") printf "#### Fixes\n\n%s\n", fixes
                if (other != "") printf "#### Other\n\n%s\n", other
              }')"
            if [ -n "$GROUPED" ]; then echo "$GROUPED"; else echo "- No changes recorded."; fi

            echo "### Build"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Version | \`${{ steps.version.outputs.name }}\` (versionCode ${{ steps.version.outputs.code }}) |"
            echo "| Commit | [\`${GITHUB_SHA::7}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}) |"
            echo "| Built | $(date -u '+%Y-%m-%d %H:%M UTC') |"
            echo "| Min SDK | 30 (Wear OS 3) |"
            echo "| Target SDK | 36 |"
            # Reflect the actual signer instead of a hardcoded claim.
            CERT="$(apksigner verify --print-certs "$APK" 2>/dev/null | grep -m1 "certificate DN" | sed 's/.*certificate DN: //')"
            CN="$(printf '%s' "$CERT" | sed -n 's/.*CN=\([^,]*\).*/\1/p')"
            if [ -n "$CN" ]; then
              echo "| Signing | release keystore (CN=$CN) |"
            else
              echo "| Signing | **unverified** — inspect the APK before distributing |"
            fi
            echo
            echo "### Install"
            echo
            echo '```bash'
            echo "adb install -r wearagent-${{ steps.version.outputs.name }}.apk"
            echo '```'
          } > release-notes.md
          cat release-notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "dist/wearagent-${{ steps.version.outputs.name }}.apk" \
            --title "WearAgent ${{ steps.version.outputs.name }}" \
            --notes-file release-notes.md \
            --verify-tag
